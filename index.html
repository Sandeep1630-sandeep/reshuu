<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reshuu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--card:#fff;--ink:#14202b;--mut:#66788a;--acc:#1f6feb;--line:#d5dce3;--acc-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141a;--card:#18212a;--ink:#e8eef4;--mut:#8ba0b3;--acc:#5aa0ff;--line:#26323d;--acc-ink:#08111a}}
:root[data-theme="dark"]{--bg:#0e141a;--card:#18212a;--ink:#e8eef4;--mut:#8ba0b3;--acc:#5aa0ff;--line:#26323d;--acc-ink:#08111a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;border-radius:9px;border:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;padding:0 16px 24px}
.t{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--card);border:1px solid var(--line);padding:0}
.t img,.t video{width:100%;height:100%;object-fit:cover;display:block}
.t i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:12px;padding:2px 7px;border-radius:99px}
#empty{margin:12vh 24px;text-align:center;color:var(--mut)}
#ed{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ed.on{display:flex}
.bar{display:flex;gap:8px;padding:10px 12px;align-items:center;justify-content:space-between}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage canvas,#stage video{max-width:100%;max-height:100%}
#tools{max-height:42vh;overflow:auto;padding:10px 14px 16px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sl{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.sl input{width:100%;accent-color:var(--acc)}
.sl b{color:var(--ink);font-weight:600;text-align:right}
#msg{font-size:13px;color:var(--mut);padding:0 14px 6px}

body:not(.authed) header,body:not(.authed) #grid,body:not(.authed) #empty{display:none}
body.authed #auth{display:none}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.ac{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.ac h2{margin:6px 0 0;font-size:24px;letter-spacing:-.3px}.ac p{margin:0;color:var(--mut)}
.ac input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.al{width:72px;height:72px;border-radius:16px;border:1px solid var(--line)}
#aerr{color:#d1342f;font-size:14px;min-height:18px}
.lnk{background:none;border:none;color:var(--acc)}

body:not(.authed) #tabs,body:not(.authed) #ahead,body:not(.authed) #fab{display:none}
#grid{display:block;padding:0 0 96px}
#tabs{gap:22px;padding:2px 16px 10px}
#tabs button{border:none;background:none;padding:2px 0;font-size:26px;color:var(--ink);border-radius:0}
#tabs button.on{color:var(--acc)}
#ahead{align-items:center;gap:10px;padding:2px 16px 10px}
#atitle{flex:1;font-size:20px}
.dl{padding:12px 16px 6px;font-size:14px;color:var(--mut)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:3px;padding:0 16px}
.t u{position:absolute;left:6px;bottom:5px;color:#fff;text-decoration:none;font-size:15px;text-shadow:0 0 3px #000}
.al3{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding:6px 16px}
.ac2{background:none;border:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.cv{aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--mut)}
.cv img,.cv video{width:100%;height:100%;object-fit:cover}
.ac2 small{color:var(--mut)}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;padding:0;border-radius:50%;background:var(--acc);color:var(--acc-ink);border:none;font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:3;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#name{flex:1;min-width:0}
#del2{display:none}
#ed:not(.editing) #tools{display:none}

<button id="asw" class="lnk">I already have an account</button>
</div></main>

<nav id="tabs" style="display:flex"><button id="tPhotos" class="on">Photos</button><button id="tAlbums">Albums</button></nav>
<div id="ahead" style="display:none"><button id="aback">Back</button><b id="atitle"></b><button id="aempty" style="display:none">Empty trash</button></div>
<div id="empty">Your gallery is empty. Tap “Add photos or videos” to import from your device.</div>
<div id="grid"></div>
<label id="fab" tabindex="0" aria-label="Add photos or videos">+<input id="file" type="file" accept="image/*,video/*" multiple hidden></label>

<section id="ed" aria-label="Viewer and editor">
  <div class="bar"><button id="back">Back</button><span id="name" style="color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button id="fav" aria-label="Favourite">♡</button><button id="del">Delete</button><button id="del2">Delete forever</button><button id="edit" class="pri">Edit</button><button id="save" class="pri">Save copy</button></div>
  <div id="stage"></div>
  <div id="msg"></div>
  <div id="tools"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const items=[];let cur=null,img=null,vid=null,cv=null;
const DEF={b:100,c:100,s:100,g:0,sep:0,bl:0};
let f={...DEF,rot:0,flip:false},vt={start:0,end:0,speed:1};
const SL=[['b','Brightness',0,200],['c','Contrast',0,200],['s','Color',0,200],['g','Black & white',0,100],['sep','Warm tone',0,100],['bl','Blur',0,10]];
const PRE={Original:{},'Black & white':{g:100,c:110},Vintage:{sep:60,c:90,b:105},Vivid:{s:150,c:115},Soft:{bl:1,b:108,s:90}};
const fs=()=>`brightness(${f.b}%) contrast(${f.c}%) saturate(${f.s}%) grayscale(${f.g}%) sepia(${f.sep}%) blur(${f.bl}px)`;
const say=t=>$('msg').textContent=t||'';

let tab='photos',album=null;
const ALB={all:'All photos',fav:'Favourites',videos:'Videos',trash:'Trash bin'};
function add(type,url,name){items.unshift({type,url,name,date:new Date(),fav:false,trashed:false});renderGrid()}
$('file').onchange=e=>{[...e.target.files].forEach(fl=>add(fl.type.startsWith('video')?'video':'image',URL.createObjectURL(fl),fl.name));e.target.value=''};

function list(a){return items.filter(it=>a==='trash'?it.trashed:!it.trashed&&(a==='fav'?it.fav:a==='videos'?it.type==='video':true))}
function thumb(it){const b=document.createElement('button');b.className='t';b.setAttribute('aria-label','Open '+it.name);
  b.innerHTML=(it.type==='image'?`<img src="${it.url}" alt="">`:`<video src="${it.url}#t=0.1" muted preload="metadata"></video><i>Video</i>`)+(it.fav?'<u>♥</u>':'');
  b.onclick=()=>openItem(it);return b}
function fillGrouped(arr,box){let last='',g;arr.forEach(it=>{const l=it.date.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  if(l!==last){last=l;const d=document.createElement('div');d.className='dl';d.textContent=l;box.appendChild(d);g=document.createElement('div');g.className='gr';box.appendChild(g)}
  g.appendChild(thumb(it))})}
function renderGrid(){
  const box=$('grid');box.innerHTML='';
  $('tabs').style.display=album?'none':'flex';$('ahead').style.display=album?'flex':'none';
  $('tPhotos').className=tab==='photos'?'on':'';$('tAlbums').className=tab==='albums'?'on':'';
  if(album||tab==='photos'){
    const arr=list(album||'all');
    if(album){$('atitle').textContent=ALB[album];$('aempty').style.display=album==='trash'&&arr.length?'':'none'}
    $('empty').textContent=album?('No items in '+ALB[album]+'.'):'No photos yet. Tap + to add photos and videos.';
    $('empty').style.display=arr.length?'none':'block';
    fillGrouped(arr,box);return}
  $('empty').style.display='none';
  const w=document.createElement('div');w.className='al3';
  const ICON={all:'🖼',fav:'♥',videos:'▶',trash:'🗑'};
  Object.keys(ALB).forEach(k=>{const l=list(k),c=l[0];const b=document.createElement('button');b.className='ac2';
    const cover=c&&k!=='trash'?(c.type==='image'?`<img src="${c.url}" alt="">`:`<video src="${c.url}#t=0.1" muted preload="metadata"></video>`):ICON[k];
    b.innerHTML=`<div class="cv">${cover}</div><span>${ALB[k]}</span><small>${l.length}</small>`;
    b.onclick=()=>{album=k;renderGrid()};w.appendChild(b)});
  box.appendChild(w);
}
$('tPhotos').onclick=()=>{tab='photos';album=null;renderGrid()};
$('tAlbums').onclick=()=>{tab='albums';album=null;renderGrid()};
$('aback').onclick=()=>{album=null;renderGrid()};
$('aempty').onclick=()=>{for(let i=items.length-1;i>=0;i--)if(items[i].trashed)items.splice(i,1);renderGrid()};

function sliders(onchange){
  const t=$('tools');t.innerHTML='';
  const pr=document.createElement('div');pr.className='row';
  Object.keys(PRE).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{Object.assign(f,DEF,PRE[k]);sliders(onchange);onchange()};pr.appendChild(b)});
  t.appendChild(pr);
  SL.forEach(([k,label,min,max])=>{
    const d=document.createElement('label');d.className='sl';
    d.innerHTML=`<span>${label}</span><input type="range" min="${min}" max="${max}" value="${f[k]}"><b>${f[k]}</b>`;
    const inp=d.querySelector('input'),o=d.querySelector('b');
    inp.oninput=()=>{f[k]=+inp.value;o.textContent=inp.value;onchange()};
    t.appendChild(d);
  });
}

let editing=false;
function setBar(){const t=cur.trashed,e=editing&&!t;
  $('fav').style.display=(t||e)?'none':'';$('fav').textContent=cur.fav?'♥':'♡';
  $('del').style.display=e?'none':'';$('del').textContent=t?'Restore':'Delete';
  $('del2').style.display=t?'inline-block':'none';
  $('edit').style.display=(t||e)?'none':'';$('save').style.display=e?'':'none';
  $('back').textContent=e?'Cancel':'Back'}
function openItem(it){
  cur=it;editing=false;$('ed').classList.remove('editing');$('name').textContent=cur.name;setBar();$('ed').classList.add('on');
  f={...DEF,rot:0,flip:false};say('');const st=$('stage');st.innerHTML='';
  if(cur.type==='image'){
    img=new Image();cv=document.createElement('canvas');st.appendChild(cv);
    img.onload=()=>{sliders(drawPhoto);extra();drawPhoto()};img.src=cur.url;
  }else{
    vid=document.createElement('video');vid.src=cur.url;vid.controls=true;vid.playsInline=true;st.appendChild(vid);
    vt={start:0,end:0,speed:1};
    vid.onloadedmetadata=()=>{vt.end=vid.duration;sliders(()=>{vid.style.filter=fs()});vidTools();vid.style.filter=fs()};
    vid.ontimeupdate=()=>{if(vid.currentTime>=vt.end&&!vid.paused){vid.pause();vid.currentTime=vt.start}};
  }
}
function extra(){
  const r=document.createElement('div');r.className='row';
  [['Rotate',()=>f.rot=(f.rot+90)%360],['Flip',()=>f.flip=!f.flip]].forEach(([n,fn])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{fn();drawPhoto()};r.appendChild(b)});
  $('tools').prepend(r);
}
function drawPhoto(){
  const w=img.naturalWidth,h=img.naturalHeight,r=f.rot%180!==0,x=cv.getContext('2d');
  cv.width=r?h:w;cv.height=r?w:h;x.filter=fs();x.save();x.translate(cv.width/2,cv.height/2);x.rotate(f.rot*Math.PI/180);x.scale(f.flip?-1:1,1);x.drawImage(img,-w/2,-h/2);x.restore();
}
function vidTools(){
  const d=document.createElement('div');
  d.innerHTML=`<label class="sl"><span>Trim start (s)</span><input id="ts" type="range" min="0" max="${vid.duration}" step="0.1" value="0"><b>0</b></label>
  <label class="sl"><span>Trim end (s)</span><input id="te" type="range" min="0" max="${vid.duration}" step="0.1" value="${vid.duration}"><b>${vid.duration.toFixed(1)}</b></label>
  <label class="sl"><span>Speed</span><input id="sp" type="range" min="0.5" max="2" step="0.25" value="1"><b>1x</b></label>`;
  $('tools').prepend(d);
  const bind=(id,fn)=>{const e=d.querySelector('#'+id);e.oninput=()=>{fn(+e.value);e.nextElementSibling.textContent=e.value+(id==='sp'?'x':'')}};
  bind('ts',v=>{vt.start=Math.min(v,vt.end-.1);vid.currentTime=vt.start});
  bind('te',v=>{vt.end=Math.max(v,vt.start+.1)});
  bind('sp',v=>{vt.speed=v;vid.playbackRate=v});
}

function closeEd(){$('ed').classList.remove('on');if(vid){vid.pause();vid=null}$('stage').innerHTML=''}
$('back').onclick=()=>editing&&!cur.trashed?openItem(cur):closeEd();
$('edit').onclick=()=>{editing=true;$('ed').classList.add('editing');setBar();say('')};
$('fav').onclick=()=>{cur.fav=!cur.fav;setBar();renderGrid()};
$('del').onclick=()=>{cur.trashed=!cur.trashed;closeEd();renderGrid()};
$('del2').onclick=()=>{const i=items.indexOf(cur);if(i>-1)items.splice(i,1);closeEd();renderGrid()};
$('save').onclick=()=>cur.type==='image'?savePhoto():saveVideo();

function savePhoto(){
  cv.toBlob(b=>{add('image',URL.createObjectURL(b),'edited-'+cur.name);say('Saved a copy to your gallery.')},'image/jpeg',.92);
}
function saveVideo(){
  if(!vid.captureStream||!window.MediaRecorder){say('This browser cannot export video. Try Chrome.');return}
  const c=document.createElement('canvas');c.width=vid.videoWidth;c.height=vid.videoHeight;const x=c.getContext('2d');
  const stream=c.captureStream(30);vid.captureStream().getAudioTracks().forEach(t=>stream.addTrack(t));
  const rec=new MediaRecorder(stream),chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{add('video',URL.createObjectURL(new Blob(chunks,{type:'video/webm'})),'edited-'+cur.name);say('Saved a copy to your gallery.')};
  $('save').disabled=true;say('Exporting… keep this screen open.');
  vid.controls=false;vid.currentTime=vt.start;
  vid.onseeked=()=>{vid.onseeked=null;vid.playbackRate=vt.speed;rec.start();vid.play();
    const step=()=>{x.filter=fs();x.drawImage(vid,0,0,c.width,c.height);
      if(vid.currentTime>=vt.end||vid.ended){vid.pause();rec.stop();vid.controls=true;$('save').disabled=false;return}
      requestAnimationFrame(step)};step()};
}

const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
async function hashPw(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let mode='reg';
function setMode(m){mode=m;const r=m==='reg';
  $('at').textContent=r?'Create your account':'Welcome back';
  $('as').textContent=r?'Register to start using Reshuu.':'Log in to open your gallery.';
  $('an').style.display=r?'':'none';$('ago').textContent=r?'Register':'Log in';
  $('asw').textContent=r?'I already have an account':'Create a new account';
  $('ap').autocomplete=r?'new-password':'current-password';$('aerr').textContent='';}
function enter(){document.body.classList.add('authed');LS.set('rs_in','1')}
$('asw').onclick=()=>setMode(mode==='reg'?'login':'reg');
$('ago').onclick=async()=>{
  const n=$('an').value.trim(),e=$('ae').value.trim().toLowerCase(),p=$('ap').value,err=$('aerr');
  if(mode==='reg'&&!n){err.textContent='Enter your full name.';return}
  if(!/^\S+@\S+\.\S+$/.test(e)&&!/^\+?[0-9]{8,14}$/.test(e)){err.textContent='Enter a valid email or mobile number.';return}
  if(p.length<6){err.textContent='Password must have 6 or more characters.';return}
  const ph=await hashPw(p);
  if(mode==='reg'){LS.set('rs_acct',JSON.stringify({n,e,ph}));enter()}
  else{let a=null;try{a=JSON.parse(LS.get('rs_acct'))}catch(x){}
    if(a&&a.e===e&&a.ph===ph)enter();else err.textContent='Email or password is not correct.'}
  $('ap').value='';
};
$('out').onclick=()=>{LS.del('rs_in');document.body.classList.remove('authed');setMode('login')};
function initAuth(){let a=null;try{a=JSON.parse(LS.get('rs_acct'))}catch(x){}
  if(a){if(LS.get('rs_in')==='1')document.body.classList.add('authed');else setMode('login')}else setMode('reg')}
renderGrid();initAuth();
</script>
</body>
</html>
